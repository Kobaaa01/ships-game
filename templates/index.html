<!DOCTYPE html>
<html>
<head>
    <title>Battleship</title>

    <style>
        body {
            font-family: Arial;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            text-align: center;
        }

        .panel {
            background: rgba(255,255,255,0.1);
            padding: 10px;
            margin: 10px auto;
            border-radius: 10px;
            width: 60%;
        }

        .main {
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(10, 35px);
            gap: 3px;
        }

        .cell {
            width: 35px;
            height: 35px;
            background: #87ceeb;
            border-radius: 5px;
            cursor: pointer;
        }

        .ship { background: gray; }
        .hit { background: red; }
        .miss { background: white; }

        #messages {
            height: 180px;
            overflow-y: auto;
            background: rgba(255,255,255,0.1);
            margin-bottom: 5px;
        }

        input {
            padding: 6px;
            border-radius: 5px;
            border: none;
        }

        button {
            padding: 6px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

<h1>Battleship</h1>
<h2>Player {{ player }}</h2>

<div class="panel" id="status"></div>

<button onclick="ready()">READY</button>

<div class="main">

    <div class="panel">
        <h3>Your Board</h3>
        <div class="grid" id="playerBoard"></div>
    </div>

    <div class="panel">
        <h3>Attack Board</h3>
        <div class="grid" id="attackBoard"></div>
    </div>

    <div class="panel">
        <h3>Chat</h3>
        <div id="messages"></div>
        <input id="msg">
        <button onclick="send()">Send</button>
    </div>

</div>

<script>
const player = "{{ player }}";

/* BOARD */
function makeBoard(id, fn) {
    const el = document.getElementById(id);

    for (let r = 0; r < 10; r++) {
        for (let c = 0; c < 10; c++) {
            const cell = document.createElement("div");
            cell.className = "cell";
            cell.onclick = () => fn(cell, r, c);
            el.appendChild(cell);
        }
    }
}

/* PLACE SHIPS */
makeBoard("playerBoard", async (cell, r, c) => {
    const res = await fetch("/place_ship", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({row: r, col: c, player})
    });

    const data = await res.json();

    if (data.success) cell.classList.add("ship");
    else alert(data.error);
});

/* ATTACK */
makeBoard("attackBoard", async (cell, r, c) => {
    const res = await fetch("/attack", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({row: r, col: c, player})
    });

    const data = await res.json();

    if (!data.success) return alert(data.error);

    if (data.result === "hit") cell.classList.add("hit");
    else cell.classList.add("miss");
});

/* READY */
async function ready() {
    const res = await fetch("/ready", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({player})
    });

    const data = await res.json();

    alert(data.success ? "READY!" : data.error);
}

/* CHAT */
async function send() {
    const msg = document.getElementById("msg");

    await fetch("/send_message", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({player, message: msg.value})
    });

    msg.value = "";
}

async function loadMessages() {
    const res = await fetch("/get_messages");
    const data = await res.json();

    const box = document.getElementById("messages");
    box.innerHTML = "";

    data.messages.forEach(m => {
        const div = document.createElement("div");
        div.textContent = (m.player === player ? "Me: " : "Enemy: ") + m.message;
        box.appendChild(div);
    });
}

/* GAME STATE HUD */
async function updateState() {
    const res = await fetch("/state");
    const s = await res.json();

    let status = "";

    status += `P1: ${s.players["1"].ready ? "READY" : "NOT READY"} (${s.players["1"].ships}/10)<br>`;
    status += `P2: ${s.players["2"].ready ? "READY" : "NOT READY"} (${s.players["2"].ships}/10)<br><br>`;

    if (!s.started) {
        status += "WAITING FOR PLAYERS...";
    } else {
        status += "GAME STARTED<br>";

        if (s.turn === player) {
            status += "YOUR TURN";
        } else {
            status += "ENEMY TURN";
        }
    }

    document.getElementById("status").innerHTML = status;
}

setInterval(loadMessages, 1000);
setInterval(updateState, 500);
</script>

</body>
</html>
